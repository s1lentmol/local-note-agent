[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-note-agent-backend"
version = "0.2.0"
description = "Local Note Agent backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "python-multipart>=0.0.20,<1",
    "trafilatura>=2,<3",
    "urllib3>=2.5,<3",
    "Pillow>=11,<13",
    "pytesseract>=0.3.13,<1",
    "faster-whisper>=1.2,<2",
    "av>=14,<19",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.12,<1", "jsonschema>=4,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
