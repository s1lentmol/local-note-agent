services:
  db:
    image: pgvector/pgvector:0.8.1-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-note_agent}
      POSTGRES_DB: ${POSTGRES_DB:-note_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./backend
    init: true
    environment:
      NOTE_AGENT_DATABASE_URL: ${NOTE_AGENT_DATABASE_URL:?Set NOTE_AGENT_DATABASE_URL in .env or environment}
      NOTE_AGENT_PROCESSING_ENABLED: ${NOTE_AGENT_PROCESSING_ENABLED:-false}
      NOTE_AGENT_CORS_ORIGINS: ${NOTE_AGENT_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - originals-data:/app/data
    ports:
      - "127.0.0.1:${NOTE_AGENT_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  originals-data:
